# =============================================
# HEALING BACKEND — Application Configuration
# =============================================

# Server
server.port=8080

# =============================================
# DATABASE (PostgreSQL)
# =============================================
# Ganti sesuai setup PostgreSQL lokal kamu:
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# =============================================
# JWT CONFIG
# =============================================
# Ganti dengan secret yang kuat (min 32 karakter) di production
healing.jwt.secret=${HEALING_JWT_SECRET}
healing.jwt.expiration-ms=${HEALING_JWT_EXPIRATION_MS}

# =============================================
# GEMINI AI API KEY
# =============================================
# Dapatkan gratis di: https://aistudio.google.com/app/apikey
healing.gemini.api-key=${HEALING_GEMINI_API_KEY}
healing.gemini.model=gemini-2.5-flash

# =============================================
# LOGGING
# =============================================
logging.level.com.healing=DEBUG
logging.level.org.springframework.security=WARN
